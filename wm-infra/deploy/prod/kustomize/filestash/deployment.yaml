apiVersion: apps/v1
kind: Deployment
metadata:
  name: filestash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filestash
  template:
    metadata:
      labels:
        app: filestash
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-filestash-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /state/config
              cp /bootstrap/config.json /state/config/config.json
              chmod 600 /state/config/config.json
          volumeMounts:
            - name: state
              mountPath: /state
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: filestash
          image: machines/filestash:latest
          env:
            - name: CONFIG_ENCRYPT
              value: "false"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filestash-secrets
                  key: ADMIN_PASSWD
            - name: APPLICATION_URL
              value: filestash.lesaventuriersducairn.fr
          ports:
            - name: http
              containerPort: 8334
              protocol: TCP
          volumeMounts:
            - name: state
              mountPath: /app/data/state
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: state
          emptyDir: {}
        - name: bootstrap
          secret:
            secretName: filestash-secrets
            items:
              - key: config.json
                path: config.json
