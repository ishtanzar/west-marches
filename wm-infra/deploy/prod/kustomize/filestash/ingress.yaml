apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filestash
  annotations:
    cert-manager.io/cluster-issuer: global-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - filestash.lesaventuriersducairn.fr
      secretName: filestash-tls
  rules:
    - host: filestash.lesaventuriersducairn.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filestash
                port:
                  name: http
