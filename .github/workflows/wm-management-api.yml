name: wm-management-api

on:
  push:
    paths:
      - .github/workflows/wm-management-api.yml
      - wm-management-api/**
      - wm-utils/**
    branches:
      - main
    tags:
      - 'releases/wm-management-api/*'
  pull_request:
    paths:
      - .github/workflows/wm-management-api.yml
      - wm-management-api/**
      - wm-utils/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            rg.fr-par.scw.cloud/westmarches-prod/wm-management-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=releases\/wm-management-api\/v(\d+.\d+.\d+(?:[a-zA-Z0-9\-]*)),group=1

      - name: Login to Scaleway registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./wm-management-api/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
